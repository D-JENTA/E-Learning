<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Akun Guru Anda</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: Arial, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            width="400"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; padding: 20px; border-radius: 6px"
          >
            <tr>
              <td align="center">
                <img width="250" src="cid:logo" />
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="font-size: 20px; font-weight: bold; color: #333"
              >
                Akun Guru Telah Dibuat
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 15px 0;
                  font-size: 14px;
                  color: #555;
                  text-align: center;
                "
              >
                Halo <strong>{{USERNAME}}</strong>, akun Anda sebagai guru telah
                dibuat oleh admin. Berikut detail login Anda:
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 10px 0;
                  font-size: 13px;
                  color: #555;
                  text-align: center;
                "
              >
                Email
              </td>
            </tr>
            <tr>
              <td align="center">
                <div
                  style="
                    font-size: 16px;
                    font-weight: bold;
                    background: #f0f4ff;
                    padding: 10px;
                    border-radius: 4px;
                    color: #2f5bea;
                  "
                >
                  {{EMAIL}}
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 15px 0 10px 0;
                  font-size: 13px;
                  color: #555;
                  text-align: center;
                "
              >
                Password yang di buat sistem, anda dapat mengubahnya
              </td>
            </tr>
            <tr>
              <td align="center">
                <div
                  style="
                    font-size: 22px;
                    font-weight: bold;
                    letter-spacing: 4px;
                    background: #f0f4ff;
                    padding: 15px;
                    border-radius: 4px;
                    color: #2f5bea;
                  "
                >
                  {{PASSWORD}}
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 20px;
                  font-size: 12px;
                  color: #888;
                  text-align: center;
                "
              >
                Demi keamanan, segera login dan ganti password Anda setelah ini.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
